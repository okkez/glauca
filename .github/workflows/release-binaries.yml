name: release-binaries

# Triggered by the GitHub Release that release-plz publishes (see release-plz.yml).
# Using the `release` event (not tag push) guarantees the Release object already
# exists, since taiki-e/upload-rust-binary-action only uploads to an existing
# release. For this to fire, release-plz must create the release with an App/PAT
# token, not the default GITHUB_TOKEN.
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Fetch git dependencies (e.g. gpui) via the git CLI for more reliable fetches.
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  upload:
    name: ${{ matrix.target }}
    # Skip on forks: nothing to publish there.
    if: github.repository_owner == 'okkez'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: ${{ matrix.target }}
          # Releases are infrequent and their build cache reuses poorly; skip
          # caching so it doesn't evict the more valuable ci.yml cache.
          cache: false

      # gpui (the GUI) needs X11/Wayland/GPU/font system libraries on Linux.
      # macOS uses Metal and needs none. Tune this list if the first GUI build
      # fails at the linker stage.
      - name: Install GUI system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libvulkan-dev

      - name: Build and upload glauca-tui
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: glauca-tui
          target: ${{ matrix.target }}
          archive: glauca-tui-$target-$tag
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload glauca-gui
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: glauca-gui
          target: ${{ matrix.target }}
          archive: glauca-gui-$target-$tag
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
