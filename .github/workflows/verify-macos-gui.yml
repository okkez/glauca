name: verify-macos-gui

# TEMPORARY: verifies the async-process patch fixes the aarch64-apple-darwin
# glauca-gui build (ci.yml is ubuntu-only and skips glauca-gui). Remove before
# merging PR #2.
on:
  push:
    branches: [fix/macos-gui-async-process-patch]
  workflow_dispatch:

permissions:
  contents: read

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    name: aarch64-apple-darwin glauca-gui
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          target: aarch64-apple-darwin
          cache: false

      - name: Build glauca-gui
        run: cargo build -p glauca-gui --locked --target aarch64-apple-darwin
