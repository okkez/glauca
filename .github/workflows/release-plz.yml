name: release-plz

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens / updates the release PR (version bump + CHANGELOG) and, once that PR
  # is merged, creates the git tag and GitHub Release.
  release-plz:
    runs-on: ubuntu-latest
    steps:
      # The tag/release must be created by a GitHub App (or PAT), NOT the default
      # GITHUB_TOKEN: a tag pushed by GITHUB_TOKEN does not trigger other
      # workflows (recursion guard), so release-binaries.yml would never fire.
      # The App needs Contents: write and Pull requests: write on this repo.
      - name: Generate a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Run release-plz
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        env:
          # GitHub auth goes through the GITHUB_TOKEN env var (the `token:` input
          # is the cargo registry token, not GitHub). Use the App token so the
          # created tag triggers release-binaries.yml.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SQLX_OFFLINE: "true"
