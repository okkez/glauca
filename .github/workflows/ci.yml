name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: rustfmt, clippy

      # rustfmt only parses, so checking the whole workspace (including the GUI)
      # is cheap and keeps every crate formatted.
      - name: Format
        run: cargo fmt --all --check

      # Scope clippy/test to core + TUI. --workspace would compile glauca-gui,
      # pulling in the gpui git deps and X11/Wayland/GPU system libraries we
      # intentionally keep out of CI.
      - name: Clippy
        run: cargo clippy -p glauca-core -p glauca-tui --all-targets -- -D warnings

      - name: Test
        run: cargo test -p glauca-core -p glauca-tui
