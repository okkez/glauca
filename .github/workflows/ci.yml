name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # rustfmt only parses, so checking the whole workspace (including the GUI)
      # is cheap and keeps every crate formatted.
      - name: Format
        run: cargo fmt --all --check

      # Scope clippy/test to core + TUI. --workspace would compile glauca-gui,
      # pulling in the gpui git deps and X11/Wayland/GPU system libraries we
      # intentionally keep out of CI.
      - name: Clippy
        run: cargo clippy -p glauca-core -p glauca-tui --all-targets -- -D warnings

      - name: Test
        run: cargo test -p glauca-core -p glauca-tui
