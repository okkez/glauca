[package]
name = "glauca-tui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "glauca-tui"
path = "src/main.rs"

[dependencies]
glauca-core.workspace = true
clap.workspace = true
anyhow.workspace = true
sqlx.workspace = true
tokio.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
octocrab.workspace = true
url.workspace = true
ratatui.workspace = true
ratatui-textarea.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
futures.workspace = true
chrono.workspace = true
tui-markdown.workspace = true
base64.workspace = true
tracing.workspace = true
# octocrab uses rustls; both aws-lc-rs and ring are in the graph, so rustls
# can't auto-pick a CryptoProvider. We install the ring provider at startup.
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tempfile.workspace = true
