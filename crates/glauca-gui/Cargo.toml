[package]
name = "glauca-gui"
edition.workspace = true
version.workspace = true
# Not published to crates.io (see glauca-core). release-plz manages releases.
publish = false

[[bin]]
name = "glauca-gui"
path = "src/main.rs"

[dependencies]
glauca-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
chrono.workspace = true
smol.workspace = true
dirs.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
reqwest_client.workspace = true
gpui-component.workspace = true
# reqwest_client uses rustls; both aws-lc-rs and ring are in the graph, so rustls
# can't auto-pick a CryptoProvider. We install the ring provider at startup.
rustls = { version = "0.23", features = ["ring"] }
