# knope drives releases for this git-only workspace.
#
# release-plz could not be used: it runs `cargo package --workspace` to
# determine versions, which fails here because glauca-gui depends on gpui (a git
# dependency not on crates.io) and glauca-tui depends on the unpublished
# glauca-core path crate. knope never runs cargo — it only edits the files below
# and talks to the GitHub API.
#
# Flow: a conventional-commit merge to main makes knope open/update a "release"
# PR (version bump + CHANGELOG). Merging that PR makes knope create the
# `v{version}` tag and a published GitHub Release, which triggers
# release-binaries.yml to build and upload the binaries.

[package]
# The shared workspace version lives in the root Cargo.toml's
# [workspace.package]; knope detects and bumps it there. Cargo.lock carries the
# version of each member crate, so keep all three in sync (release-binaries.yml
# builds with --locked).
versioned_files = [
  "Cargo.toml",
  { path = "Cargo.lock", dependency = "glauca-core" },
  { path = "Cargo.lock", dependency = "glauca-tui" },
  { path = "Cargo.lock", dependency = "glauca-gui" },
]
changelog = "CHANGELOG.md"
# No `assets`: binary upload is handled by release-binaries.yml on the
# release: published event.

[github]
owner = "okkez"
repo = "glauca"

# Render each changelog entry with a clickable PR link and author.
# $pr_number / $pr_author_login require knope >= 0.23.0 and the [github] config
# above; knope resolves the PR for each commit via the GitHub API. Entries with
# no resolvable PR fall back to the second template (plain summary). GitHub does
# not autolink "#N" inside a committed file, so the full PR URL is spelled out.
[release_notes]
change_templates = [
  "- $summary ([#$pr_number](https://github.com/okkez/glauca/pull/$pr_number) by @$pr_author_login)",
  "- $summary",
]

# Opens/updates the release PR. Run on push to main (see prepare-release.yml).
[[workflows]]
name = "prepare-release"
[[workflows.steps]]
type = "Command"
command = "git switch -c release"
[[workflows.steps]]
type = "PrepareRelease"
[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""
[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"
[[workflows.steps]]
type = "CreatePullRequest"
base = "main"
[workflows.steps.title]
template = "chore: prepare release $version"
[workflows.steps.body]
template = "Generated by knope. Merging this PR creates the release.\n\n$changelog"

# Creates the git tag + published GitHub Release. Run when the release PR merges
# (see release.yml).
[[workflows]]
name = "release"
[[workflows.steps]]
type = "Release"
