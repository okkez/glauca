[workspace]
members = ["crates/glauca-core", "crates/glauca-tui", "crates/glauca-gui", "crates/glauca-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.2.2"
# Not published to crates.io: the workspace depends on gpui via git, which
# crates.io forbids. knope manages versions/changelog/releases only; see
# knope.toml for why release-plz could not be used.
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
octocrab = "0.44"
url = "2"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
ratatui-textarea = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
frizbee = "0.9"
futures = "0.3"
chrono = { version = "0.4.44", features = ["clock"] }
# 0.3.9 is the floor, not a preference: earlier versions panic on a task list item
# inside a loose list, which real PR descriptions hit. The mechanism, the upstream
# PR, and the tests that hold this floor are in
# crates/glauca-tui/src/tui/ui/markdown.rs.
tui-markdown = "0.3.9"
base64 = "0.22"
tempfile = "3.27.0"
rstest = "0.26"
glauca-core = { path = "crates/glauca-core" }
smol = "2"
# gpui GUI stack (pre-1.0, git-only). We track zed's default branch (same reference
# gpui-component uses internally) so the whole graph resolves to ONE gpui. The exact
# commit is pinned in Cargo.lock; bump it deliberately. Requires rustc >= 1.95
# (see rust-toolchain.toml).
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# Real HTTP client for the gpui App (remote avatar image loading). Same git
# source as gpui so the whole graph resolves to ONE http_client/gpui rev.
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "cda0fc7fd4e4809dd2a8bae0337ac43b49e9f675" }

# Release builds: shrink binaries (the TUI is distributed as a gh extension
# download) without giving up debuggability or CI time. Measured on linux
# x86_64 (glauca-gui / glauca-tui, baseline 57.0M / 20.1M):
#   - strip = "debuginfo" keeps symbol names so crash backtraces stay readable;
#     full strip would save a further ~5.7M / ~1.6M.
#   - lto = "thin" halves link time vs fat LTO (4.5min vs 8min for gui+tui)
#     for ~1.8M / ~0.6M of size; fat + full strip would reach 31.9M / 12.1M.
#   - panic = "abort" drops unwinding tables (~4M / ~1.2M): a panic in any
#     thread now aborts the process instead of unwinding — tokio task panics
#     are no longer contained as JoinErrors, which is acceptable since the
#     engine treats task failure as unrecoverable anyway.
#   - codegen-units = 1 lets LLVM optimize each crate as a whole (smaller and
#     faster code); the extra compile time is paid only in release builds.
#   - opt-level stays 3, not "z": "z" shrinks further but generates size-first
#     code in gpui's per-frame text shaping / rasterization loops, trading away
#     exactly the GUI responsiveness the dev-profile section below protects.
[profile.release]
strip = "debuginfo"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Dev builds: keep the workspace crates unoptimized (fast incremental compiles)
# but optimize every dependency. gpui's text layout / rasterization path is
# unusably slow at opt-level 0, which made `cargo run -p glauca-gui` feel
# sluggish; the hot per-frame code all lives in dependencies (gpui, taffy,
# cosmic-text, frizbee), so this recovers near-release runtime speed while our
# own crates still rebuild quickly.
[profile.dev.package."*"]
opt-level = 3

# gpui-component patches psm for stacker; mirror it since [patch] does not propagate
# from a git dependency's own workspace.
[patch.crates-io]
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }
# zed patches async-process to a fork that adds Child::adopt_raw_pid, used by
# util/src/command/darwin.rs (macOS only). [patch] does not propagate from zed's
# own workspace, so without mirroring it the aarch64-apple-darwin glauca-gui build
# fails with E0599. async-task is the other patch zed applies; mirror both so the
# dependency graph resolves identically to zed's.
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
