[workspace]
members = ["crates/glauca-core", "crates/glauca-tui", "crates/glauca-gui"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.7"
# Not published to crates.io: the workspace depends on gpui via git, which
# crates.io forbids. release-plz manages versions/changelog/releases only.
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
octocrab = "0.44"
url = "2"
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
ratatui-textarea = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
futures = "0.3"
chrono = { version = "0.4.44", features = ["clock"] }
tui-markdown = "0.3"
base64 = "0.22"
tempfile = "3.27.0"
glauca-core = { path = "crates/glauca-core" }
smol = "2"
# gpui GUI stack (pre-1.0, git-only). We track zed's default branch (same reference
# gpui-component uses internally) so the whole graph resolves to ONE gpui. The exact
# commit is pinned in Cargo.lock; bump it deliberately. Requires rustc >= 1.95
# (see rust-toolchain.toml).
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
# Real HTTP client for the gpui App (remote avatar image loading). Same git
# source as gpui so the whole graph resolves to ONE http_client/gpui rev.
reqwest_client = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "cda0fc7fd4e4809dd2a8bae0337ac43b49e9f675" }

# gpui-component patches psm for stacker; mirror it since [patch] does not propagate
# from a git dependency's own workspace.
[patch.crates-io]
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }
# zed patches async-process to a fork that adds Child::adopt_raw_pid, used by
# util/src/command/darwin.rs (macOS only). [patch] does not propagate from zed's
# own workspace, so without mirroring it the aarch64-apple-darwin glauca-gui build
# fails with E0599. async-task is the other patch zed applies; mirror both so the
# dependency graph resolves identically to zed's.
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
